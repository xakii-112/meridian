[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-research"
version = "1.0.0"
description = "Agent-based limit order book simulation, market-making strategies and analytics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
real = ["scipy>=1.11", "websockets>=12", "aiohttp>=3.9"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["meridian_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
